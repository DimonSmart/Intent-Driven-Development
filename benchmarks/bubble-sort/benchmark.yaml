name: bubble-sort
description: Small deterministic .NET task used to compare direct execution with production Factory.

model: gpt-5.6-luna

reasoning:
  effort: high

repeat: 3
timeoutMinutes: 20
windowsSandbox: elevated
task: task.md

acceptance:
  command: powershell
  arguments:
    - -NoProfile
    - -ExecutionPolicy
    - Bypass
    - -File
    - acceptance.ps1

modes:
  - direct
  - factory
