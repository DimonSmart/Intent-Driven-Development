cases:
  - id: explicit-new-feature
    fixture: related-intent-without-feature-spec
    request: "Use idd-factory-run. Add File Usage panel with the complete product behavior, safety rules, non-goals, and acceptance scenarios supplied in this request."
    expected_relation: ExplicitIntentChange
    expected_intent_status: updated
    expected_factory_started: true
    forbidden_outcomes: [INTENT_REQUIRED_FOR_MISSING_DOCUMENT]

  - id: implementation-details-do-not-leak
    fixture: file-operations-product
    request_contains: [product-behavior, WindowsFileUsagePlatformService, private-interface-examples, implementation-order, test-method-details]
    expected_intent_contains: [product-behavior]
    forbidden_intent_contains: [WindowsFileUsagePlatformService, private-interface-examples, implementation-order, test-method-details]
    expected_runtime_request: exact-original-request

  - id: existing-owner-update
    fixture: existing-owning-spec
    expected_relation: ExplicitIntentChange
    expected_owner_action: update-existing-spec
    forbidden_actions: [create-duplicate-spec]
    expected_factory_started: true

  - id: new-owning-spec
    fixture: distinct-new-product-area
    expected_relation: ExplicitIntentChange
    expected_owner_action: idd-intent-new-document
    expected_index_updated: true
    expected_factory_started: true

  - id: genuine-missing-safety-decision
    fixture: process-owner-operations
    request: "Use idd-factory-run to add Unlock. Either kill the owner process or forcibly close its foreign handle, whichever is easier."
    expected_relation: MissingIntentDecision
    expected_outcome: INTENT_REQUIRED
    expected_missing_decision_area: process-owner-safety
    expected_factory_started: false

  - id: implementation-only-forbids-intent-write
    fixture: insufficient-current-intent
    request: "Use idd-factory-run to implement this, but do not update IDD specs. The request also suggests new product behavior."
    expected_scope: implementation-only
    expected_outcome: INTENT_REQUIRED
    expected_intent_status: unchanged
    expected_factory_started: false

  - id: existing-intent-sufficient
    fixture: fully-covered-feature
    expected_relation: Covered
    expected_intent_status: unchanged
    expected_factory_started: true

  - id: explicit-conflict-supersedes-old-intent
    fixture: owner-never-terminated
    request: "Use idd-factory-run. The selected owner may now be terminated after explicit confirmation. Implement the change."
    expected_relation: ExplicitIntentChange
    expected_owner_action: update-existing-spec
    forbidden_outcomes: [UNNECESSARY_CONFIRMATION, INTENT_REQUIRED]

  - id: pasted-explicit-conflict-before-runtime
    fixture: unix-mouse-mode-1002-only
    request: "Use idd-factory-run. Implement the hover marquee described in the supplied pasted-text file."
    request_supplied_file:
      name: pasted-text.txt
      content: "Hover marquee requires passive pointer movement on Unix. Panels must use xterm 1003 + 1006 instead of the current normative 1002 + 1006; full mouse-mode teardown remains required."
    expected_relation: ExplicitIntentChange
    expected_owner_action: update-existing-spec
    expected_intent_contains: ["1003 + 1006"]
    expected_factory_started_after_intent_update: true
    forbidden_actions: [factory-start-before-intent-update, planner-discovers-initial-1002-1003-conflict]

  - id: materialized-request-survives-host-attachment
    fixture: supplied-cyrillic-hover-marquee
    request_transport_contains: ["# Files pasted by the user:", ".codex/attachments", "pasted-text.txt"]
    request_supplied_file:
      name: pasted-text.txt
      encoding: utf-8
      content: "# ТЗ: Hover marquee\nИспользовать 1003 + 1006. Сохранить Unicode: café, Málaga, 漢字 и 🔒."
    expected_runtime_request: self-contained-materialized-logical-request
    expected_request_artifact_contains: ["# ТЗ: Hover marquee", "1003 + 1006", "Сохранить Unicode"]
    forbidden_request_artifact_dependency: host-local-pasted-text
    expected_factory_started: true

  - id: corrupted-pasted-unicode-stops-before-runtime
    fixture: supplied-text-with-replacement-character
    request_supplied_file:
      name: pasted-text.txt
      content_contains_unicode_replacement: true
    expected_outcome: INVALID_REQUEST_ENCODING
    expected_factory_started: false

  - id: ambiguous-conflict
    fixture: conflicting-owner-behavior
    request: "Use idd-factory-run to revise owner shutdown behavior while retaining whichever existing safety rule is appropriate."
    expected_relation: MissingIntentDecision
    expected_outcome: INTENT_REQUIRED
    expected_factory_started: false

  - id: technical-research-only
    fixture: clear-product-semantics-uncertain-api
    request: "Use idd-factory-run. The UX and safety semantics are complete; research whether the platform API can target only the selected owner."
    expected_relation: ExplicitIntentChange
    expected_factory_started: true
    expected_factory_capability_allowed: research
    forbidden_outcomes: [INTENT_REQUIRED_FOR_TECHNICAL_UNCERTAINTY]

