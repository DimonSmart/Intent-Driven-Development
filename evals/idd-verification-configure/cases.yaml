cases:
  - name: simple-dotnet
    expect: one stable check assigned by default for every context
  - name: ui-layering
    expect: UI checks use subtask, integration checks use checkpoint, and full checks use final
  - name: costly-suite
    expect: discovery does not run it and proposed run check requires confirmation
  - name: manual-ui
    expect: an instructions check remains Not verified until the user confirms it
  - name: existing-policy
    expect: policy is not rewritten without explicit reconfiguration
  - name: valid-yaml-policy
    expect: a complete valid .idd/verification.yaml document is loaded as the project policy
  - name: yaml-document-loading
    expect: .idd/verification.yaml is read directly as one YAML document without extracting Markdown fenced content
  - name: markdown-in-yaml-policy
    expect: Markdown headings or fenced YAML in .idd/verification.yaml are rejected as invalid YAML without fallback
  - name: invalid-yaml-policy
    expect: invalid YAML blocks the current operation without repository or platform fallback
  - name: unsupported-policy-version
    expect: an unsupported policy version blocks the current operation without repository or platform fallback
  - name: missing-yaml-policy
    expect: absent .idd/verification.yaml uses the repository or platform fallback
  - name: unrelated-markdown-file
    repository_fixture: unrelated-markdown-file
    expect: absent .idd/verification.yaml uses the ordinary repository or platform fallback; the legacy Markdown file is ignored
  - name: repository-script
    expect: use the repository-owned aggregate command without classifying its internals
  - name: multi-area-scope
    expect: a narrow path rule is rejected unless it covers the complete scope
  - name: invalid-policy
    expect: unknown check IDs block required contexts without hidden fallback
  - name: cheap-discovery
    expect: no broad tests, external commands, or broad source reading
  - name: intent-boundary
    expect: .idd/intent is unchanged
