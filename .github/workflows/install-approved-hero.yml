name: Install Approved Hero

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/replace-hero-image
          fetch-depth: 0

      - name: Restore and validate approved hero
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          from pathlib import Path
          import base64
          import json
          import os
          import re
          import urllib.request

          sha = "50737705b45a41cfff7fe13ed5b84f1b3f3ada77"
          url = f"https://api.github.com/repos/DimonSmart/Intent-Driven-Development/git/blobs/{sha}"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          svg = base64.b64decode(payload["content"])
          text = svg.decode("utf-8")
          match = re.search(r'data:image/webp;base64,([^\"]+)', text)
          if not match:
              raise SystemExit("Embedded WebP data URI was not found")

          image = base64.b64decode(match.group(1), validate=True)
          if image[:4] != b"RIFF" or image[8:12] != b"WEBP":
              raise SystemExit("Embedded payload is not a WebP image")
          if len(image) != 37364:
              raise SystemExit(f"Unexpected embedded WebP size: {len(image)}")

          Path("docs/assets/idd-hero.svg").write_bytes(svg)
          print(f"Validated approved hero blob {sha}: {len(svg)} SVG bytes, {len(image)} WebP bytes")

      - name: Commit hero replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/install-approved-hero.yml
          git add docs/assets/idd-hero.svg .github/workflows/install-approved-hero.yml
          git commit -m "Replace IDD hero image"
          git push origin HEAD:agent/replace-hero-image
