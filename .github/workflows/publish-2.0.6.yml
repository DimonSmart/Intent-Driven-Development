name: Publish IDD 2.0.6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-2.0.6.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run full check
        shell: pwsh
        run: pwsh ./scripts/Check.ps1 -Version 2.0.6

      - name: Validate Claude native plugin layout
        shell: pwsh
        run: |
          if (Get-Command claude -ErrorAction SilentlyContinue) {
            claude plugin validate artifacts/marketplace
            claude plugin validate artifacts/marketplace/plugins/claude/idd
          } else {
            Write-Host "Claude CLI is not available in CI; structural smoke tests already ran."
          }

      - name: Validate required publish paths
        shell: pwsh
        run: |
          $required = @(
            "artifacts/marketplace/.claude-plugin/marketplace.json",
            "artifacts/marketplace/.agents/plugins/marketplace.json",
            "artifacts/marketplace/plugins/claude/idd",
            "artifacts/marketplace/plugins/codex/idd"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required publish path: $path"
            }
          }

      - name: Build publish root
        shell: bash
        run: |
          rm -rf /tmp/idd-marketplace
          mkdir -p /tmp/idd-marketplace
          cp -R artifacts/marketplace/. /tmp/idd-marketplace/
          cp README.md /tmp/idd-marketplace/README.md

      - name: Publish marketplace branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin marketplace || true
          if git show-ref --verify --quiet refs/remotes/origin/marketplace; then
            git switch -C marketplace origin/marketplace
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git switch --orphan marketplace
            git rm -rf . || true
          fi
          cp -R /tmp/idd-marketplace/. .
          git add .
          if git diff --cached --quiet; then
            echo "Marketplace branch already contains version 2.0.6."
          else
            git commit -m "Publish IDD marketplace 2.0.6"
            git push origin marketplace
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.6
          target_commitish: main
          name: v2.0.6
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
