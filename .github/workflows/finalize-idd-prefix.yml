name: Finalize IDD prefix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'idd-prefix-update'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: idd-prefix-update
          fetch-depth: 0

      - name: Apply final corrections
        shell: bash
        run: |
          python .github/scripts/finalize-idd-document-id-update.py || true
          python .github/scripts/finish-idd-document-id-update.py

      - name: Generate artifacts and run checks
        shell: pwsh
        run: pwsh ./scripts/Check.ps1 -Version 0.0.0

      - name: Commit finalized result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-idd-prefix.yml
          rm .github/scripts/finalize-idd-document-id-update.py
          rm .github/scripts/finish-idd-document-id-update.py
          rm -f .github/idd-prefix-update-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten IDD document ID rules"
          git push origin HEAD:idd-prefix-update
