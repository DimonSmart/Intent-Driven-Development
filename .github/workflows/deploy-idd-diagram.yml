name: Deploy IDD diagram

on:
  push:
    branches:
      - main
    paths:
      - docs/diagram/**
      - .github/workflows/deploy-idd-diagram.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout pinned Archify
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          ref: 7f483b61e8f68d0d5c3219d2c943c5381c8db0b1
          path: .archify

      - name: Generate standalone diagram
        shell: pwsh
        run: |
          node .archify/archify/bin/archify.mjs finalize workflow docs/diagram/idd-overview.workflow.json site/index.html --repo-root $env:GITHUB_WORKSPACE --quality showcase --json

      - name: Upload generated diagram
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
