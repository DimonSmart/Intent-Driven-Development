name: Temporary semantic technical finalize

on:
  push:
    branches:
      - semantic-technical-restart

permissions:
  contents: write

jobs:
  finalize:
    # This helper is removed after the finalization commit succeeds.
    if: ${{ !contains(github.event.head_commit.message, '[finalize-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-technical-restart
          fetch-depth: 0
      - name: Narrow ambiguous test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/Idd.Factory.Tests/TaskRelatedIntentTests.cs')
          text = test.read_text(encoding='utf-8')
          start = text.index('public async Task RetryAfterBudgetExtensionReloadsCurrentIntentContentsWithoutReselection()')
          end = text.index('public async Task StateRoundTripPreservesCurrentAndRemainingRelatedIntent()', start)
          segment = text[start:end]
          old = 'File.WriteAllText(Path.Combine(scenario.WorkspacePath, "first-attempt.txt"), "first");'
          if segment.count(old) != 1:
              raise RuntimeError(f'Expected one target occurrence, got {segment.count(old)}')
          segment = segment.replace(old, 'File.WriteAllText(Path.Combine(invocation.Workspace, "first-attempt.txt"), "first");')
          test.write_text(text[:start] + segment + text[end:], encoding='utf-8', newline='\n')

          helper = Path('.github/semantic-technical-finalize.py')
          source = helper.read_text(encoding='utf-8')
          block = '''replace_once(\n    "tests/Idd.Factory.Tests/TaskRelatedIntentTests.cs",\n    'File.WriteAllText(Path.Combine(scenario.WorkspacePath, "first-attempt.txt"), "first");',\n    'File.WriteAllText(Path.Combine(invocation.Workspace, "first-attempt.txt"), "first");')\n'''
          if source.count(block) != 1:
              raise RuntimeError(f'Expected one helper block, got {source.count(block)}')
          helper.write_text(source.replace(block, ''), encoding='utf-8', newline='\n')
          PY
      - name: Apply final source and documentation changes
        run: python .github/semantic-technical-finalize.py
      - name: Commit final changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalize changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[finalize-bot] Complete semantic retry and technical restart split"
          git push origin HEAD:semantic-technical-restart
