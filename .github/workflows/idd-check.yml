name: IDD Fast Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run fast validation
        shell: pwsh
        run: pwsh ./scripts/Check.ps1 -Mode Fast -Version 0.0.0

  fast-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run fast validation
        id: check
        shell: pwsh
        run: |
          & pwsh ./scripts/Check.ps1 -Mode Fast -Version 0.0.0 *> check.log
          $exitCode = $LASTEXITCODE
          Get-Content check.log
          exit $exitCode

      - name: Upload failed validation log
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fast-validation-log
          path: check.log
          if-no-files-found: error
