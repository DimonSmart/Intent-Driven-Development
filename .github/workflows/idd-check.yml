name: IDD Fast Validation

on:
  pull_request:
  push:
    branches:
      - main
      - feature/visual-intent-brainstorm

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run release validation
        shell: pwsh
        run: pwsh ./scripts/Check.ps1 -Mode Release -Version 0.0.0

  fast-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run fast validation
        id: check
        shell: pwsh
        run: |
          & pwsh ./scripts/Check.ps1 -Mode Fast -Version 0.0.0 *> check.log
          $exitCode = $LASTEXITCODE
          Get-Content check.log
          exit $exitCode

      - name: Upload failed validation log
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fast-validation-log
          path: check.log
          if-no-files-found: error

  agent-trace-isolated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test copied AgentTrace directory
        shell: bash
        run: |
          set -euo pipefail
          cp -a agent-trace "$RUNNER_TEMP/agent-trace"
          cd "$RUNNER_TEMP/agent-trace"
          dotnet build CodexTrace.slnx --nologo
          dotnet test CodexTrace.slnx --no-build --nologo
