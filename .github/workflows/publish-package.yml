name: Publish Intent-Driven Development Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Run check
        run: pwsh ./scripts/Check.ps1

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack release artifacts
        run: pwsh ./scripts/Pack-Release.ps1 -Version ${{ steps.extract_version.outputs.VERSION }} -SkipCheck

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/intent-driven-development-v${{ steps.extract_version.outputs.VERSION }}.zip
            ./artifacts/checksums.txt
            ./artifacts/DimonSmart.IntentDrivenDevelopment.Tool.${{ steps.extract_version.outputs.VERSION }}.nupkg
            ./artifacts/*.tgz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish .NET tool to NuGet
        run: |
          dotnet nuget push "./artifacts/DimonSmart.IntentDrivenDevelopment.Tool.${{ steps.extract_version.outputs.VERSION }}.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish ./artifacts/intent-driven-development-${{ steps.extract_version.outputs.VERSION }}.tgz
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skip npm publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; npm publish skipped. The npm package archive is attached to the GitHub Release."