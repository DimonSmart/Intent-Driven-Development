name: IDD Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run check
        shell: pwsh
        run: pwsh ./scripts/Check.ps1 -Version 0.0.0

  smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run check
        id: check
        shell: pwsh
        run: |
          & pwsh ./scripts/Check.ps1 -Version 0.0.0 *> check.log
          $exitCode = $LASTEXITCODE
          Get-Content check.log
          exit $exitCode

      - name: Upload failed check log
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-check-log
          path: check.log
          if-no-files-found: error
