<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">The Intent-Driven Development thought experiment</title>
  <desc id="description">Delete the implementation, keep only the intent, and ask whether a Coding Agent can rebuild the product.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1120" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A2D"/>
      <stop offset="1" stop-color="#1A2740"/>
    </linearGradient>
    <linearGradient id="intent" x1="481" y1="263" x2="719" y2="403" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD86A"/>
      <stop offset="1" stop-color="#F3A73A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <circle cx="105" cy="90" r="70" fill="#FFFFFF" fill-opacity="0.025"/>
  <circle cx="1115" cy="540" r="125" fill="#FFFFFF" fill-opacity="0.025"/>

  <text x="600" y="82" text-anchor="middle" fill="#AFC4E5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">INTENT-DRIVEN DEVELOPMENT</text>
  <text x="600" y="143" text-anchor="middle" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">A thought experiment</text>

  <g filter="url(#shadow)">
    <rect x="84" y="238" width="278" height="190" rx="22" fill="#253553" stroke="#425779" stroke-width="2"/>
    <text x="223" y="278" text-anchor="middle" fill="#FF9D9D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">DELETE</text>
    <text x="223" y="320" text-anchor="middle" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">THE IMPLEMENTATION</text>
    <g fill="#91A6C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
      <text x="120" y="365">code</text>
      <text x="210" y="365">tests</text>
      <text x="289" y="365">plans</text>
      <text x="120" y="398">tasks</text>
      <text x="210" y="398">status</text>
      <text x="289" y="398">reviews</text>
    </g>
  </g>

  <path d="M390 333H454" stroke="#7186A8" stroke-width="6" stroke-linecap="round"/>
  <path d="M441 318L458 333L441 348" stroke="#7186A8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="480" y="238" width="240" height="190" rx="22" fill="url(#intent)"/>
    <text x="600" y="282" text-anchor="middle" fill="#4F3515" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5">KEEP ONLY</text>
    <text x="600" y="330" text-anchor="middle" fill="#24190D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850">THE INTENT</text>
    <text x="600" y="376" text-anchor="middle" fill="#5D411E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">durable product truth</text>
  </g>

  <path d="M746 333H810" stroke="#7186A8" stroke-width="6" stroke-linecap="round"/>
  <path d="M797 318L814 333L797 348" stroke="#7186A8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="838" y="216" width="278" height="234" rx="22" fill="#203D39" stroke="#3D7B70" stroke-width="2"/>
    <text x="977" y="261" text-anchor="middle" fill="#82E6C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">CAN A CODING AGENT</text>
    <text x="977" y="310" text-anchor="middle" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">REBUILD</text>
    <text x="977" y="351" text-anchor="middle" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">THE PRODUCT?</text>
    <rect x="902" y="382" width="150" height="42" rx="21" fill="#5AD7B3"/>
    <text x="977" y="410" text-anchor="middle" fill="#11302A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850">FROM SCRATCH</text>
  </g>

  <text x="600" y="525" text-anchor="middle" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Your implementation is replaceable.</text>
  <text x="600" y="563" text-anchor="middle" fill="#FFD16A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">Your product intent is not.</text>
</svg>
